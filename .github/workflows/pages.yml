name: Deploy Web

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'app/src/main/assets/question_bank.json'
      - 'scripts/build_web.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web
        run: node scripts/build_web.mjs

      - name: Stage site
        run: |
          mkdir -p site
          cp docs/index.html site/

      # 发布到 gh-pages 分支（Pages 已配置为该分支模式，无需 Pages API 权限）
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: false