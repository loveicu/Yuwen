name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 禁用跨 run 缓存：曾出现增量编译缓存污染导致同代码稳定失败，
          # 本项目构建仅约 40 秒，稳定优先
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/文萃刷题-v${{ steps.version.outputs.version }}.apk"

      # 题库热更新资产：bank_override.json 与内置题库同构（version + questions）。
      # meta.version 取题目内容的 SHA256 前 7 位十六进制转十进制（小于 2^31），
      # 题目一变版本自动变化，加题无需手动 bump version。
      - name: Prepare bank assets
        run: |
          mkdir -p release
          BANK_VERSION=$((16#$(jq -S '[.questions]' app/src/main/assets/question_bank.json | sha256sum | cut -c1-7)))
          # jq 必须加 -n（不读 stdin），否则 CI 空 stdin 会生成 0 字节文件
          jq -n --argjson q "$(jq -c '.questions' app/src/main/assets/question_bank.json)" \
             --argjson v "$BANK_VERSION" \
             '{version: $v, questions: $q}' > release/bank_override.json
          jq -n --argjson v "$BANK_VERSION" \
             --argjson n "$(jq '.questions | length' app/src/main/assets/question_bank.json)" \
             '{version: $v, fileName: "bank_override.json", questionCount: $n, notes: "content-hash"}' > release/bank_meta.json
          # 守卫：任一资产为空则快速失败，避免发布残缺 Release
          [ -s release/bank_override.json ] || { echo "FATAL: bank_override.json 为空"; exit 1; }
          [ -s release/bank_meta.json ] || { echo "FATAL: bank_meta.json 为空"; exit 1; }
          echo "bank content version: $BANK_VERSION"
          ls -la release/

      # 每次构建都更新「latest」release，供应用内更新系统检查
      - name: Delete existing release if exists
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建 v${{ steps.version.outputs.version }}
          body: |
            自动构建于 ${{ github.event.head_commit.message }}
            
            > 通过应用内「检查更新」或直接下载安装。版本号以文件名为准。
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WenCuiQuiz-apk
          path: release/*.apk